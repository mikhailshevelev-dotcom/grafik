const B=new Date(2026,10,1),ND=426,dt=i=>new Date(2026,10,1+i),doy=(y,m,d)=>Math.round((new Date(y,m,d)-B)/864e5),MO=[[2026,10],[2026,11]].concat(Array.from({length:12},(_,k)=>[2027,k]));
const $=id=>document.getElementById(id);
let T=new Date();const ti=()=>{const i=doy(T.getFullYear(),T.getMonth(),T.getDate());return i>=0&&i<ND?i:-1},cm=()=>{const k=MO.findIndex(a=>a[0]==T.getFullYear()&&a[1]==T.getMonth());return k<0?0:k};
const st={v:"m",m:ti()>=0?cm():0,p:"",g:{},sel:null};Object.keys(GC).forEach(k=>st.g[k]=true);
const duty=[];for(let i=0;i<ND;i++)duty.push(P.filter(x=>x[2][i]=="D"));
const hol=i=>P[0][2][i]=="p";
const cnt={};duty.forEach(a=>a.forEach(x=>cnt[x[0]]=(cnt[x[0]]||0)+1));
const ok=x=>st.g[x[1]]&&(!st.p||x[0]==st.p);const AL={"Пашкова":"Карась","Сухова":"Соколова"},sn=n=>{const l=n.split(" ")[0];return AL[l]?`${l} (${AL[l]})`:l},DN=n=>{const[l,...r]=n.split(" ");return AL[l]?`${l} (${AL[l]}) ${r.join(" ")}`:n};
const fmt=i=>dt(i).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const sel=$("p");P.forEach(x=>{if(cnt[x[0]]){const o=document.createElement("option");o.value=x[0];o.textContent=DN(x[0]);sel.appendChild(o)}});
sel.onchange=()=>{st.p=sel.value;st.sel=null;draw()};
$("g").innerHTML=Object.keys(GC).filter(k=>k!="Рук").map(k=>`<button data-g="${k}"><i style="background:${GC[k]}"></i>${GN[k]=="Руководитель"?"Руководители":GN[k]}</button>`).join("");
$("g").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.g[b.dataset.g]=!st.g[b.dataset.g];draw()};
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(b){st.v=b.dataset.v;draw()}};
function today(){T=new Date();$("dn").textContent=T.getDate();$("mn").textContent=MG[T.getMonth()];$("yy").textContent=T.getFullYear();
$("wd").textContent=T.toLocaleDateString("ru-RU",{weekday:"long"});$("tm").textContent=T.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
let s,i=ti();const nd=k=>{while(k<ND&&!duty[k].length)k++;return k<ND?k:-1},df=k=>`${dt(k).getDate()} ${MG[dt(k).getMonth()]}`;
if(i>=0){const a=duty[i];s=a.length?`Сегодня дежурят: <b>${a.map(x=>DN(x[0])).join(", ")}</b>`:"Сегодня дежурных нет";
const n=nd(i+1);if(n>=0)s+=`<div class="sub2">Ближайшее дежурство: ${df(n)}</div>`}
else{const n=nd(0);s=`График составлен на ноябрь 2026 – декабрь 2027. ${i<0&&T<B?"Первое":"Последнее"} дежурство: <b>${df(i<0&&T<B?n:ND-1-[...duty].reverse().findIndex(a=>a.length))}</b>`}
$("ts").innerHTML=s}
$("go").onclick=()=>{const i=ti();st.v="m";st.m=i>=0?cm():0;st.sel=i>=0?i:null;draw()};
function chip(x){return `<span class="ch ${AL[x[0].split(" ")[0]]?"w2":""} ${ok(x)?(st.p?"hl":""):"dim"}" style="background:${GC[x[1]]}">${sn(x[0])}</span>`}
const mnth=k=>{const[y,m]=MO[k];return{y,m,off:(new Date(y,m,1).getDay()+6)%7,n:new Date(y,m+1,0).getDate()}};
function vm(){const{y,m,off,n}=mnth(st.m),t=ti(),me=st.p&&P.find(x=>x[0]==st.p);
let h=`<div class="card"><div class="nav"><button id="pv">‹</button><b>${MN[m]} ${y}</b><button id="nxm">›</button></div><div class="grid">`+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d=>`<div class="dow">${d}</div>`).join("");
for(let i=0;i<off;i++)h+=`<div class="c e"></div>`;
for(let d=1;d<=n;d++){const i=doy(y,m,d),w=(off+d-1)%7>4,vac=me&&"obv".includes(me[2][i]);
h+=`<div class="c ${w?"we":""} ${hol(i)?"h":""} ${vac?"v":""} ${i==t?"td":""} ${st.sel===i?"sel":""}" data-i="${i}"><span class="n">${d}</span>${duty[i].map(chip).join("")}</div>`}
$("v").innerHTML=h+`</div><div class="sub2">Рамка и цветной номер — сегодня · розовый фон — праздник${st.p?" · сиреневый — отпуск/больничный сотрудника":""}</div></div>`;
$("pv").onclick=()=>{st.m=(st.m+13)%14;st.sel=null;draw()};$("nxm").onclick=()=>{st.m=(st.m+1)%14;st.sel=null;draw()};
$("v").onclick=e=>{const c=e.target.closest(".c[data-i]");if(c){st.sel=+c.dataset.i;draw()}}}
function vy(){const t=ti();let h=`<div class="yg">`;MO.forEach(([y,m],k)=>{const{off,n}=mnth(k);
h+=`<div class="ym" data-m="${k}"><b>${MN[m]} ${y}</b><div class="mg">`+"<span></span>".repeat(off);
for(let d=1;d<=n;d++){const i=doy(y,m,d),a=duty[i].filter(ok);
h+=`<div class="d ${hol(i)?"h":""} ${a.length?"k":""} ${i==t?"td":""}" ${a.length?`style="background:${GC[a[0][1]]}"`:""}>${d}</div>`}
h+=`</div></div>`});$("v").innerHTML=h+`</div>`;
$("v").onclick=e=>{const c=e.target.closest(".ym");if(c){st.m=+c.dataset.m;st.v="m";draw()}}}
function vt(){const t=ti(),W=[],of=(B.getDay()+6)%7;for(let i=0;i<ND;i++){const w=Math.floor((i+of)/7);(W[w]=W[w]||[]).push(i)}
let h=`<div class="card tl"><table><tr><td></td>`+W.map(w=>{const f=w.find(i=>dt(i).getDate()==1);return `<td class="mh">${f==null?"":MS[dt(f).getMonth()]+(dt(f).getMonth()==0?" ’27":"")}</td>`}).join("")+`</tr>`;
P.forEach(x=>{const dim=!ok(x)&&(st.p||!st.g[x[1]]);h+=`<tr style="${dim?"opacity:.25":""}"><td class="nm" data-n="${x[0]}"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${GC[x[1]]};margin-right:5px"></i>${DN(x[0])}</td>`+
W.map(w=>{const dd=w.filter(i=>x[2][i]=="D"),o=w.filter(i=>x[2][i]=="o").length,tw=w.includes(t)?" tw":"";
return `<td class="w${tw}" ${dd.length?`data-i="${dd[0]}" style="background:${GC[x[1]]}">Д`:o?`style="background:#951b81${o>3?"cc":o>1?"77":"40"}">`:">"}</td>`}).join("")+`</tr>`});
$("v").innerHTML=h+`</table><div class="sub2">Д — дежурство · фиолетовый — отпуск (насыщеннее — больше дней в неделе) · рамка — текущая неделя. Нажмите на имя, чтобы выделить сотрудника.</div></div>`;
$("v").onclick=e=>{const n=e.target.closest(".nm"),c=e.target.closest(".w[data-i]");if(n){st.p=st.p==n.dataset.n?"":n.dataset.n;sel.value=st.p;draw()}else if(c){st.sel=+c.dataset.i;draw()}}}
function sheet(){const el=$("sh"),i=st.sel;if(i==null){el.hidden=true;return}
const vac=P.filter(x=>x[2][i]=="o"),oth=P.filter(x=>"bv".includes(x[2][i]));el.hidden=false;
el.innerHTML=`<div class="sh-h"><b>${fmt(i)}<small>${hol(i)?"Праздничный день":i==ti()?"Сегодня":"Дежурство "+(duty[i].length?"назначено":"не назначено")}</small></b><button id="x">✕</button></div>`+
(duty[i].length?duty[i].map(x=>{const[l,f]=x[0].split(" ");return `<div class="mgr" style="border-color:${GC[x[1]]}"><div class="av">${(f||"")[0]||""}${l[0]}</div><div><div class="fn">${f||l}</div><div class="ln">${f?sn(x[0]):""}</div><div class="gp" style="color:${GC[x[1]]}">Дежурный · ${GN[x[1]]}</div><div class="wt">🕙 10:00–16:00 · ${x[0].startsWith("Крюкова")?"московское":"тюменское"} время</div></div></div>`}).join(""):`<div class="vac">В этот день дежурных нет</div>`)+
(vac.length?`<div class="vac"><b>В отпуске (${vac.length}):</b> ${vac.map(x=>DN(x[0])).join(", ")}</div>`:"")+
(oth.length?`<div class="vac"><b>Б / В:</b> ${oth.map(x=>`${DN(x[0])} (${x[2][i]=="b"?"Б":"В"})`).join(", ")}</div>`:"");
$("x").onclick=()=>{st.sel=null;draw()}}
function info(){const a=Object.values(cnt);$("sum").innerHTML=`<span>Дежурных суббот: <b>${duty.filter(a=>a.length).length}</b></span><span>Дежурных: <b>${a.length}</b></span><span>На человека: <b>${Math.min(...a)}–${Math.max(...a)}</b></span>`;
let t="";if(st.p){const ds=[];duty.forEach((a,i)=>{if(a.some(x=>x[0]==st.p))ds.push(i)});
t=ds.length?`<b>${DN(st.p)}</b>: ${ds.length} дежурств — `+ds.map(i=>`${dt(i).getDate()} ${MS[dt(i).getMonth()]}${dt(i).getFullYear()==2026?" ’26":""}`).join(", "):`<b>${DN(st.p)}</b> в дежурствах не участвует`}$("nx").innerHTML=t}
function draw(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v==st.v));
document.querySelectorAll("#g button").forEach(b=>b.classList.toggle("off",!st.g[b.dataset.g]));
({m:vm,y:vy,t:vt})[st.v]();sheet();info()}
today();draw();setInterval(today,30000);
</script></body></html>
