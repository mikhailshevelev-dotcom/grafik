<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>График отдела оформления</title>
<style>
:root{--bg:#f5f6f9;--sf:#fff;--tx:#1c2230;--mu:#687086;--bd:#e0e4ec;--ac:#2f6fed;--we:#eceff5;
--w:#d4efdb;--wt:#17662f;--u:#c9edf0;--ut:#0d6770;--o:#ffe0ad;--ot:#845000;--b:#ffcdcd;--bt:#992020;--d:#e2d5fa;--dt:#5628a3;--v:#dfe3ec;--vt:#4d5566;--bad:#ffd9d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--sf:#1d2129;--tx:#e8ebf2;--mu:#9aa2b5;--bd:#2d3340;--ac:#6c9bff;--we:#252a34;--w:#1f4a2c;--wt:#9fe0b4;--u:#14484d;--ut:#8fdbe2;--o:#5a3d0b;--ot:#ffd391;--b:#5a2323;--bt:#ffb3b3;--d:#3b2c63;--dt:#cdb6ff;--v:#343a47;--vt:#b4bbcb;--bad:#5a2323}}
:root[data-theme="dark"]{--bg:#14171d;--sf:#1d2129;--tx:#e8ebf2;--mu:#9aa2b5;--bd:#2d3340;--ac:#6c9bff;--we:#252a34;--w:#1f4a2c;--wt:#9fe0b4;--u:#14484d;--ut:#8fdbe2;--o:#5a3d0b;--ot:#ffd391;--b:#5a2323;--bt:#ffb3b3;--d:#3b2c63;--dt:#cdb6ff;--v:#343a47;--vt:#b4bbcb;--bad:#5a2323}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
h1{font-size:18px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button,select,input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=search]{min-width:150px;flex:1;max-width:240px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lg span{padding:3px 9px;border-radius:99px;cursor:pointer;font-size:12px;border:1px solid transparent}
.lg span.on{border-color:var(--tx)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 6px}
.grp{display:flex;gap:6px;align-items:baseline;margin:3px 0;flex-wrap:wrap}
.grp b{min-width:92px;font-weight:600}.grp i{font-style:normal;color:var(--mu)}
.nm{padding:1px 8px;border-radius:99px;font-size:12px}
.wrap{overflow:auto;max-height:68vh;background:var(--sf);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:separate;border-spacing:0;font-size:12px}
th,td{padding:0;text-align:center;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd)}
thead th{position:sticky;top:0;background:var(--sf);z-index:2;height:36px;min-width:28px;cursor:pointer;font-weight:600}
thead th small{display:block;font-weight:400;color:var(--mu);font-size:10px}
th.we{background:var(--we)}th.td{box-shadow:inset 0 -3px var(--ac)}th.sel{background:var(--ac);color:#fff}th.sel small{color:#fff}
th.n{position:sticky;left:0;z-index:3;text-align:left;padding:0 10px;min-width:170px;background:var(--sf);font-weight:500;cursor:default;white-space:nowrap}
thead th.n{z-index:4}
th.n small{color:var(--mu);margin-left:6px;font-size:10px;display:inline;font-weight:400}
td.c{height:30px;min-width:28px;font-weight:600}
td.we{background:var(--we)}td.sel{outline:2px solid var(--ac);outline-offset:-2px}
.sw{background:var(--w);color:var(--wt)}.su{background:var(--u);color:var(--ut)}.so{background:var(--o);color:var(--ot)}.sb{background:var(--b);color:var(--bt)}.sd{background:var(--d);color:var(--dt)}.sv{background:var(--v);color:var(--vt)}
td.st{min-width:34px;color:var(--mu)}
tr.cov td,tr.cov th{position:sticky;bottom:0;background:var(--sf);z-index:2;font-weight:600;border-top:2px solid var(--bd)}
tr.cov th.n{z-index:3}td.bad{background:var(--bad)!important}
.wrap[data-hl="Р"] td.c:not([data-s="Р"]),.wrap[data-hl="У"] td.c:not([data-s="У"]),.wrap[data-hl="О"] td.c:not([data-s="О"]),.wrap[data-hl="Б"] td.c:not([data-s="Б"]),.wrap[data-hl="Д"] td.c:not([data-s="Д"]),.wrap[data-hl="В"] td.c:not([data-s="В"]){opacity:.15}
.note{color:var(--mu);font-size:12px;margin-top:8px}
.pm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.pm[hidden]{display:none}
.sheet{background:var(--sf);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:480px;max-height:100%;overflow:auto;padding:14px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}.sh h2{margin:0;font-size:17px}.sh small{color:var(--mu)}
.mt{flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.ch{text-align:center;font-size:11px;color:var(--mu)}
.cd{aspect-ratio:1/1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent;cursor:pointer}
.cd span{font-size:11px;opacity:.75}.cd b{font-size:15px;line-height:1}
.cd.we{background:var(--we)}.cd.tdy{border-color:var(--ac)}.cd.e{cursor:default}
.st2{margin-bottom:6px}
.nm.sx{background:var(--we);color:var(--mu)}
.pl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pr{text-align:left;padding:10px;display:block;width:100%;cursor:pointer}
.pt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.pt small{color:var(--mu)}
.strip{display:flex;gap:2px}.strip i{flex:1;height:14px;border-radius:3px;background:var(--we)}.strip i.cur{outline:2px solid var(--ac);outline-offset:1px}
.strip i.sw{background:var(--wt)}.strip i.su{background:var(--ut)}.strip i.so{background:var(--ot)}.strip i.sb{background:var(--bt)}.strip i.sd{background:var(--dt)}.strip i.sv{background:var(--vt)}
th.n[data-p]{cursor:pointer}th.n a{color:var(--ac)}
@media (max-width:700px){body{padding:8px}.pm{align-items:flex-end;padding:0}.sheet{max-width:none;border-radius:16px 16px 0 0;max-height:92%;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}th.n{min-width:130px}}
</style></head><body>
<h1>График отдела оформления</h1>
<div class="bar">
<button id="pv" aria-label="Предыдущий месяц">←</button><select id="ms"></select><button id="nx" aria-label="Следующий месяц">→</button><button id="tdy">Сегодня</button>
<input type="search" id="q" placeholder="Поиск по сотруднику"><span class="chips"><button id="vl">Список</button><button id="vt">Таблица</button></span>
</div>
<div class="bar"><div class="chips" id="cy"></div><label><input type="checkbox" id="we"> скрыть выходные</label></div>
<div class="bar lg" id="lg"></div>
<div class="card" id="day"></div>
<div class="wrap" id="tb"></div>
<div class="pl" id="pl"></div>
<div class="pm" id="pm" hidden></div>
<div class="note">Нажмите на фамилию — откроется календарь сотрудника. Нажмите на дату — увидите, кто в этот день где. Статус в легенде подсвечивается в таблице. Нижняя строка — сколько сотрудников на связи (Р, У, Д) в выбранном городе.</div>

 ${r?`<div class="chips st2"><span class="nm sw">Работал(а): ${n('РУ')}</span><span class="nm so">Отпуск: ${n('О')}</span><span class="nm sb">Больничный: ${n('Б')}</span><span class="nm sd">Дежурств: ${n('Д')}</span></div>`:'<div class="note">В этом месяце сотрудника нет в графике</div>'}

 ${rg('О','Отпуска 2026')}${rg('Б','Больничные 2026')}</div>`;
}
render();
